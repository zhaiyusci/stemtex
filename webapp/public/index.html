<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XeTeX Snippet Preview</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-pane">
        <div class="toolbar">
          <label class="width-control">
            <span>版心宽度</span>
            <input id="widthRange" type="range" min="180" max="430" step="10" value="360">
            <input id="widthInput" type="number" min="180" max="430" step="10" value="360">
            <span class="unit">pt</span>
          </label>
          <span class="range-note">180-430 pt</span>
          <button id="renderButton" type="button">排版</button>
        </div>
        <textarea id="snippetInput" spellcheck="false">这是一个小段中文和数学的预览：$E=mc^2$，以及 \textcolor{blue}{蓝色文字}。

\[
  \int_0^1 x^2\,dx = \frac{1}{3}
\]

\ce{H2O} 与 $\ip{1}{0}$。</textarea>
      </section>
      <section class="preview-pane">
        <div class="preview-status">
          <span id="statusText">等待排版</span>
          <span id="metricsText"></span>
        </div>
        <iframe id="pdfFrame" title="PDF preview"></iframe>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
